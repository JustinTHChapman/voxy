modLoader = "javafml"
loaderVersion = "[1,)"
license = "LGPL-3.0-or-later"
issueTrackerURL = "https://github.com/MCRcortex/voxy/issues"

[[mods]]
    modId = "${mod_id}"
    version = "${mod_version}"
    displayName = "Voxy LOD (NeoForge)"
    description = """
        Server-native Level-of-Detail (LOD) rendering mod.
        Generates LOD chunks on the server, transfers them to clients, and caches
        them locally so only changed chunks need to be re-downloaded.
    """
    logoFile = "voxy.png"
    authors = "cortex"

[[dependencies.voxy]]
    modId = "neoforge"
    type = "required"
    versionRange = "[21.1.230,21.2)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.voxy]]
    modId = "minecraft"
    type = "required"
    versionRange = "[${mc_version},1.22)"
    ordering = "NONE"
    side = "BOTH"

# Sodium is required on the client: voxy's renderer mixes into Sodium's chunk renderer.
# The mixins target Sodium 0.6.13 internals; 0.7+ changes them, so it is excluded until rewritten.
[[dependencies.voxy]]
    modId = "sodium"
    type = "required"
    versionRange = "[0.6.13,0.7)"
    ordering = "BEFORE"
    side = "CLIENT"

[[mixins]]
    config = "common.voxy.mixins.json"

[[mixins]]
    config = "client.voxy.mixins.json"

[[mixins]]
    config = "voxy.compat.moreculling.mixins.json"

[[mixins]]
    config = "voxy.compat.sodium.mixins.json"

[[accessTransformers]]
    file = "META-INF/accesstransformer.cfg"
