name: build-check

# Full CI (compile/test/build/artifact/release) for neoforge-rewrite lives in
# build.yml. This lightweight build check covers every OTHER branch — and PRs
# not targeting neoforge-rewrite — so feature branches still get a build signal
# without double-building neoforge-rewrite.
on:
  push:
    branches-ignore: [neoforge-rewrite]
  pull_request:
    branches-ignore: [neoforge-rewrite]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Gradle build
        run: ./gradlew build --no-daemon
        env:
          GRADLE_OPTS: "-Xmx2g"
          CI: "true"
