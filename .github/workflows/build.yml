name: Build, Test, Publish

on:
  push:
    branches: [neoforge-rewrite]
  pull_request:
    branches: [neoforge-rewrite]
  workflow_dispatch:

permissions:
  contents: write   # needed to create/update the rolling Release
  checks: write     # needed to post JUnit test results

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:
    name: Build & Test (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Make gradlew executable
        run: chmod +x gradlew

      # ---- Compile sanity check (fast fail before MC asset download) ----
      - name: Compile
        run: ./gradlew compileJava compileTestJava --no-daemon
        env:
          GRADLE_OPTS: "-Xmx2g"
          CI: "true"

      # ---- Run unit tests (downloads MC assets on first run, then cached) ----
      - name: Test
        run: ./gradlew test --no-daemon
        env:
          GRADLE_OPTS: "-Xmx2g"
          CI: "true"

      - name: Publish JUnit report
        uses: mikepenz/action-junit-report@v4
        if: always()
        continue-on-error: true
        with:
          report_paths: 'build/test-results/test/TEST-*.xml'
          check_name: 'JUnit Test Results'
          require_tests: true

      # ---- Build the mod jar ----
      - name: Build
        run: ./gradlew build --no-daemon
        env:
          GRADLE_OPTS: "-Xmx2g"
          CI: "true"

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: voxy-neoforge-${{ github.sha }}
          path: build/libs/*.jar
          retention-days: 30

      # ---- Publish a rolling "latest" Release on pushes to neoforge-rewrite ----
      - name: Update rolling latest Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/neoforge-rewrite'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-neoforge-rewrite
          name: "Latest neoforge-rewrite build"
          body: |
            Automatic build from commit ${{ github.sha }}.

            **This is an automated rolling release. Do not link to it as a stable version.**
          prerelease: true
          files: |
            build/libs/*.jar
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}

      # ---- Trigger .minecraft sync workflow ----
      - name: Notify .minecraft repo to sync voxy
        if: github.event_name == 'push' && github.ref == 'refs/heads/neoforge-rewrite'
        continue-on-error: true   # non-fatal: secret may not be set
        env:
          GH_TOKEN: ${{ secrets.MINECRAFT_REPO_DISPATCH_TOKEN }}
        run: |
          gh api repos/JustinTHChapman/.minecraft/dispatches \
            -f event_type=voxy-release \
            -f "client_payload[sha]=${{ github.sha }}"
