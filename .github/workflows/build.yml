name: Build & Test

on:
  push:
    branches: [neoforge-rewrite]
  pull_request:
    branches: [neoforge-rewrite]
  workflow_dispatch:

permissions:
  contents: read
  checks: write     # needed to post JUnit test results

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:
    name: Build & Test (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Make gradlew executable
        run: chmod +x gradlew

      # ---- Compile sanity check (fast fail before MC asset download) ----
      - name: Compile
        run: ./gradlew compileJava compileTestJava --no-daemon
        env:
          GRADLE_OPTS: "-Xmx2g"
          CI: "true"

      # ---- Run unit tests (downloads MC assets on first run, then cached) ----
      - name: Test
        run: ./gradlew test --no-daemon
        env:
          GRADLE_OPTS: "-Xmx2g"
          CI: "true"

      - name: Publish JUnit report
        uses: mikepenz/action-junit-report@v4
        if: always()
        continue-on-error: true
        with:
          report_paths: 'build/test-results/test/TEST-*.xml'
          check_name: 'JUnit Test Results'
          require_tests: true

      # ---- Build the mod jar ----
      - name: Build
        run: ./gradlew build --no-daemon
        env:
          GRADLE_OPTS: "-Xmx2g"
          CI: "true"

      # NOTE: The mod jar is intentionally NOT published as a public artifact or
      # GitHub Release. The license (LICENSE.md) is "All rights reserved. Do not
      # redistribute.", and on a public repo both build artifacts and Releases are
      # publicly downloadable. The only deploy below targets the PRIVATE .minecraft
      # repo for personal mod-pack use, which is not public redistribution.

      # ---- Push jar directly to .minecraft repo via SSH deploy key ----
      # Best-effort: this is a personal mod-pack deploy, so a hiccup here (e.g. the
      # .minecraft repo's Git LFS budget being exhausted) must not fail the CI checks.
      - name: Push jar to .minecraft
        if: github.event_name == 'push' && github.ref == 'refs/heads/neoforge-rewrite'
        continue-on-error: true
        env:
          MINECRAFT_DEPLOY_KEY: ${{ secrets.MINECRAFT_DEPLOY_KEY }}
          # We only swap the voxy jar, so don't download every other mod's LFS content on clone.
          GIT_LFS_SKIP_SMUDGE: "1"
        run: |
          set -euo pipefail

          # Verify secret is present
          if [ -z "${MINECRAFT_DEPLOY_KEY:-}" ]; then
            echo "::error::MINECRAFT_DEPLOY_KEY secret is not set. Add it in Settings → Secrets → Actions."
            exit 1
          fi

          # Set up SSH agent with the deploy key
          mkdir -p ~/.ssh
          printf '%s\n' "$MINECRAFT_DEPLOY_KEY" > ~/.ssh/mc_deploy_key
          chmod 600 ~/.ssh/mc_deploy_key
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/mc_deploy_key -o IdentitiesOnly=yes"

          # Find the built jar (exclude sources and all-jar variants)
          JAR=$(find build/libs -name "voxy-neoforge-*.jar" ! -name "*sources*" ! -name "*all*" | head -1)
          if [ -z "$JAR" ]; then
            echo "::error::No matching jar found in build/libs — check archivesName in build.gradle"
            ls -la build/libs/
            exit 1
          fi
          JAR_NAME=$(basename "$JAR")
          echo "Deploying $JAR_NAME"

          # Clone .minecraft
          git clone git@github.com:JustinTHChapman/.minecraft.git mc-repo

          # Replace any existing voxy-*.jar
          rm -f mc-repo/mods/voxy-*.jar
          cp "$JAR" "mc-repo/mods/$JAR_NAME"

          # Commit and push if changed
          cd mc-repo
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mods/
          if git diff --cached --quiet; then
            echo "Already up to date, nothing to push."
            exit 0
          fi
          git commit -m "chore(mods): update voxy to $JAR_NAME

          Source: https://github.com/JustinTHChapman/voxy/commit/${{ github.sha }}"
          git push
