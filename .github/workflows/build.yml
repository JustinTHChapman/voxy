name: Build, Test, Publish

on:
  push:
    branches: [neoforge-rewrite]
  pull_request:
    branches: [neoforge-rewrite]
  workflow_dispatch:

permissions:
  contents: write   # needed to create/update the rolling Release
  checks: write     # needed to post JUnit test results

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:
    name: Build & Test (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Make gradlew executable
        run: chmod +x gradlew

      # ---- Compile sanity check (fast fail before MC asset download) ----
      - name: Compile
        run: ./gradlew compileJava compileTestJava --no-daemon
        env:
          GRADLE_OPTS: "-Xmx2g"
          CI: "true"

      # ---- Run unit tests (downloads MC assets on first run, then cached) ----
      - name: Test
        run: ./gradlew test --no-daemon
        env:
          GRADLE_OPTS: "-Xmx2g"
          CI: "true"

      - name: Publish JUnit report
        uses: mikepenz/action-junit-report@v4
        if: always()
        continue-on-error: true
        with:
          report_paths: 'build/test-results/test/TEST-*.xml'
          check_name: 'JUnit Test Results'
          require_tests: true

      # ---- Build the mod jar ----
      - name: Build
        run: ./gradlew build --no-daemon
        env:
          GRADLE_OPTS: "-Xmx2g"
          CI: "true"

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: voxy-neoforge-${{ github.sha }}
          path: build/libs/*.jar
          retention-days: 30

      # ---- Publish a rolling "latest" Release on pushes to neoforge-rewrite ----
      - name: Update rolling latest Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/neoforge-rewrite'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-neoforge-rewrite
          name: "Latest neoforge-rewrite build"
          body: |
            Automatic build from commit ${{ github.sha }}.

            **This is an automated rolling release. Do not link to it as a stable version.**
          prerelease: true
          files: |
            build/libs/*.jar
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}

      # ---- Push jar directly to .minecraft repo via SSH deploy key ----
      - name: Push jar to .minecraft
        if: github.event_name == 'push' && github.ref == 'refs/heads/neoforge-rewrite'
        continue-on-error: true   # non-fatal if deploy key not yet set up
        env:
          MINECRAFT_DEPLOY_KEY: ${{ secrets.MINECRAFT_DEPLOY_KEY }}
        run: |
          set -euo pipefail

          # Set up SSH agent with the deploy key
          mkdir -p ~/.ssh
          printf '%s\n' "$MINECRAFT_DEPLOY_KEY" > ~/.ssh/mc_deploy_key
          chmod 600 ~/.ssh/mc_deploy_key
          ssh-keyscan -H github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/mc_deploy_key -o IdentitiesOnly=yes"

          # Find the built jar (exclude sources)
          JAR=$(find build/libs -name "voxy-neoforge-*.jar" ! -name "*sources*" | head -1)
          JAR_NAME=$(basename "$JAR")

          # Clone .minecraft
          git clone git@github.com:JustinTHChapman/.minecraft.git mc-repo

          # Replace any existing voxy-*.jar
          rm -f mc-repo/mods/voxy-*.jar
          cp "$JAR" "mc-repo/mods/$JAR_NAME"

          # Commit and push if changed
          cd mc-repo
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mods/
          if git diff --cached --quiet; then
            echo "Already up to date, nothing to push."
            exit 0
          fi
          git commit -m "chore(mods): update voxy to $JAR_NAME

          Source: https://github.com/JustinTHChapman/voxy/commit/${{ github.sha }}"
          git push
