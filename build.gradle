plugins {
    id 'net.neoforged.moddev' version '2.0.78'
    id 'java-library'
}

version = project.mod_version
group = project.maven_group
base.archivesName = project.archives_base_name

java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}

neoForge {
    version = project.neoforge_version

    parchment {
        mappingsVersion = project.parchment_version
        minecraftVersion = project.parchment_minecraft
    }

    accessTransformers = [file('src/main/resources/META-INF/accesstransformer.cfg')]

    runs {
        client {
            client()
            systemProperty 'forge.logging.console.level', 'debug'
            programArgument '--username'
            programArgument 'Dev'
            gameDirectory = project.file('run/client')
        }
        server {
            server()
            systemProperty 'forge.logging.console.level', 'debug'
            programArgument '--nogui'
            gameDirectory = project.file('run/server')
        }
        data {
            data()
            programArguments = [
                '--mod',      project.mod_id,
                '--all',
                '--output',   file('src/generated/resources/').absolutePath,
                '--existing', file('src/main/resources/').absolutePath
            ]
            gameDirectory = project.file('run/data')
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    unitTest {
        enable()
        testedMod = mods.getByName(project.mod_id)
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'NeoForge'
        url = 'https://maven.neoforged.net/releases'
    }
    // Modrinth (Sodium, ModMenu, etc.)
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter { includeGroup 'maven.modrinth' }
    }
    // CaffeineMC (Sodium snapshots / config-api)
    maven {
        name = 'CaffeineMC'
        url = 'https://maven.caffeinemc.net/releases'
    }
}

configurations {
    // Expose sqlite-jdbc as a dependency that gets shaded/jarJar'd
    jarJarDep
}

dependencies {
    // ---- Upstream Voxy native/util deps ----
    // jspecify nullness annotations (compile-only, used as markers)
    compileOnly 'org.jspecify:jspecify:1.0.0'
    // JNA for Windows CPU affinity (CpuLayout / Taskbar) — pinned to MC's strict version
    implementation 'net.java.dev.jna:jna:5.14.0'
    implementation 'net.java.dev.jna:jna-platform:5.14.0'
    // OSHI for system info (cpu count/layout) — pinned to MC's strict version
    implementation 'com.github.oshi:oshi-core:6.4.10'
    // LMDB native bindings (compileOnly only — bundling via jarJar breaks FML
    // mod-discovery on NeoForge 1.21.1, so LMDB backend is unavailable at runtime
    // unless the user supplies lwjgl-lmdb themselves. Default backend is in-memory.
    compileOnly 'org.lwjgl:lwjgl-lmdb:3.3.3'
    // ZSTD compressor via LWJGL native bindings (operates on direct memory pointers)
    implementation 'org.lwjgl:lwjgl-zstd:3.3.3'
    runtimeOnly 'org.lwjgl:lwjgl-zstd:3.3.3:natives-windows'
    runtimeOnly 'org.lwjgl:lwjgl-zstd:3.3.3:natives-linux'
    runtimeOnly 'org.lwjgl:lwjgl-zstd:3.3.3:natives-macos'
    // LZ4 compressor
    implementation 'org.lz4:lz4-java:1.8.0'
    // XZ (lzma) compressor
    implementation 'org.tukaani:xz:1.9'
    // Redis client (optional storage backend) — exclude transitive slf4j to avoid MC conflict
    implementation('redis.clients:jedis:5.1.5') { exclude group: 'org.slf4j' }
    // RocksDB (optional storage backend)
    implementation 'org.rocksdb:rocksdbjni:9.7.3'

    // ---- Sodium for NeoForge 1.21.1 (compile-only; runtime via user pack) ----
    // Voxy's Sodium mixins target the 0.7+ API but only 0.6.13 is stable here —
    // the mixins will need rewriting; for now compileOnly so the rest of the
    // codebase can build.
    compileOnly 'maven.modrinth:sodium:mc1.21.1-0.6.13-neoforge'

    // SQLite for LOD section caching (still used by our fork's storage backend)
    implementation('org.xerial:sqlite-jdbc:3.46.1.3')
    jarJar('org.xerial:sqlite-jdbc') {
        version {
            strictly '[3.46.0,4.0.0)'
            prefer '3.46.1.3'
        }
    }

    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testImplementation 'org.mockito:mockito-core:5.12.0'
    testRuntimeOnly  'org.junit.platform:junit-platform-launcher'
}

sourceSets {
    test {
        java {
            exclude 'me/cortex/voxy/test/broken/**'
        }
    }
}

test {
    useJUnitPlatform()
    maxHeapSize = '1G'
    testLogging {
        events 'passed', 'skipped', 'failed'
        showExceptions = true
        showCauses = true
        showStackTraces = true
    }
}

// Optional local deploy lives in `deploy-local.gradle`, which is gitignored because
// it holds personal, machine-specific paths. When that file exists it registers a
// `deployLocal` task. Everyone else just doesn't get the task — the build is unaffected.
def deployLocalScript = file('deploy-local.gradle')
if (deployLocalScript.exists()) {
    apply from: deployLocalScript
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
    options.deprecation = true
    options.compilerArgs += ['-Xmaxerrs', '2000', '-Xmaxwarns', '0']
}

jar {
    manifest {
        attributes([
            'Specification-Title'    : project.mod_id,
            'Specification-Vendor'   : project.maven_group,
            'Specification-Version'  : '1',
            'Implementation-Title'   : project.name,
            'Implementation-Version' : project.jar.archiveVersion,
            'Implementation-Vendor'  : project.maven_group,
        ])
    }
}

processResources {
    def props = [
        mod_id     : project.mod_id,
        mod_version: project.mod_version,
        mc_version : project.minecraft_version,
        nf_version : project.neoforge_version
    ]
    inputs.properties(props)
    filesMatching('META-INF/neoforge.mods.toml') {
        expand(props)
    }
}

